# Default language for console and players whose client language is not supported.
# Player messages and GUIs automatically use the client language when available
# (en, ru, de, fr, pl, pt, tr). Fallback is this value.
# Available: en, ru, de, fr, tr, pl, pt

# Plugin info
config-version: "2.2.0"
language: "en"

# Update checker
# Set to false to disable update checking
check-for-updates: true

# Feature toggles
features:
  player-selection: true
  mass-operations: true
  quick-actions: true
  full-management: true
  transaction-retention-days: 30
  # Maximum allowed amount per single operation. Set to 0 to disable the limit.
  max-amount: 0

mysql:
  enabled: false
  host: "localhost"
  port: 3306
  database: "economygui"
  username: "root"
  password: ""